<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - 3LINK Networks</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            primary: '#0047BA',
            'primary-dark': '#00358A',
            'brand-blue': '#00D2FF',
          }
        }
      }
    }
  </script>
  <style>
    .bg-fiber-login {
      background: radial-gradient(circle at 70% 30%, #0d1e3d 0%, #030712 100%);
    }
  </style>
</head>
<body class="bg-slate-950 font-sans text-slate-800 flex justify-center items-center min-h-screen p-0 md:p-6">

  <!-- Responsive Container -->
  <div class="relative w-full md:max-w-4xl min-h-screen md:min-h-[650px] md:h-[650px] bg-white shadow-2xl md:rounded-[40px] flex flex-col md:flex-row overflow-hidden border border-slate-200">
    
    <!-- Left Branding Panel (Hidden on mobile, visible on desktop) -->
    <div class="hidden md:flex md:w-1/2 bg-fiber-login text-white p-12 flex-col justify-between items-center text-center relative overflow-hidden border-r border-slate-800">
      <!-- Glow effect -->
      <div class="absolute inset-0 bg-gradient-to-tr from-primary/20 via-transparent to-brand-blue/10 pointer-events-none"></div>
      
      <!-- Top placeholder -->
      <div class="flex items-center gap-1.5 self-start text-white/90">
        <svg class="w-6 h-6 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        <span class="text-sm font-black tracking-wide">3LINK Networks</span>
      </div>

      <!-- Center Logo & Tagline -->
      <div class="my-auto space-y-4 z-10">
        <div class="flex items-baseline justify-center gap-0.5 select-none">
          <span class="text-4xl font-extrabold text-brand-blue tracking-tight drop-shadow-[0_0_8px_rgba(0,210,255,0.4)]">3</span>
          <span class="text-4xl font-black text-white tracking-wide">LINK</span>
        </div>
        <p class="text-sm font-medium text-slate-300 max-w-xs mx-auto leading-relaxed">
          Connecting you to high-speed fiber internet with smart app-based control panel.
        </p>
      </div>

      <!-- Bottom Tagline info -->
      <div class="text-xs text-slate-500 font-semibold self-start text-left">
        &copy; 2026 3LINK Networks Ltd.
      </div>
    </div>

    <!-- Right Login Column (Full width on mobile, half on desktop) -->
    <div class="w-full md:w-1/2 flex flex-col justify-between bg-white min-h-screen md:min-h-0 py-6">
      
      <!-- Status Bar (Mobile Only) -->
      <div class="w-full flex justify-between items-center text-xs text-slate-500 font-semibold px-8 pt-2 pb-2 md:hidden">
        <div>9:41</div>
        <div class="flex items-center gap-1.5">
          <i data-lucide="signal" class="w-3.5 h-3.5 text-slate-800"></i>
          <i data-lucide="wifi" class="w-3.5 h-3.5 text-slate-800"></i>
          <i data-lucide="battery" class="w-4 h-4 text-slate-800"></i>
        </div>
      </div>

      <!-- Form Content -->
      <div class="flex-grow flex flex-col justify-center px-8 md:px-10 py-4">
        <!-- Small logo on mobile header -->
        <div class="text-center mb-6 md:hidden">
          <div class="flex items-center justify-center gap-1">
            <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <span class="text-xl font-black text-slate-900 tracking-tight">3LINK</span>
          </div>
        </div>

        <!-- Greeting -->
        <div class="text-center md:text-left mb-6">
          <h2 class="text-2xl font-black text-slate-900 tracking-tight">Welcome Back!</h2>
          <p class="text-sm text-slate-500 mt-1 font-semibold">Login to your portal account</p>
        </div>

        <!-- Form -->
        <form action="dashboard.html" class="space-y-4">
          <!-- Mobile Input -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5" for="mobile">Mobile Number</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                <i data-lucide="user" class="w-4.5 h-4.5"></i>
              </span>
              <input 
                type="text" 
                id="mobile" 
                placeholder="01XXXXXXXXX" 
                value="017XXXXXXXX"
                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-450 focus:outline-none focus:border-primary focus:bg-white transition-all font-semibold text-sm"
                required
              >
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5" for="password">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                <i data-lucide="lock" class="w-4.5 h-4.5"></i>
              </span>
              <input 
                type="password" 
                id="password" 
                placeholder="••••••••" 
                value="supersecretpassword"
                class="w-full pl-11 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-450 focus:outline-none focus:border-primary focus:bg-white transition-all font-semibold text-sm"
                required
              >
              <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="eye-off" class="w-4.5 h-4.5"></i>
              </button>
            </div>
          </div>

          <!-- Forgot Password -->
          <div class="text-right">
            <a href="#" class="text-xs font-bold text-primary hover:text-primary-dark transition-colors">Forgot Password?</a>
          </div>

          <!-- Login Button -->
          <button 
            type="submit" 
            class="w-full py-3.5 bg-primary hover:bg-primary-dark text-white font-bold rounded-xl shadow-lg shadow-primary/20 active:scale-[0.99] transition-all text-sm uppercase tracking-wider block text-center"
          >
            Login
          </button>
        </form>

        <!-- Signup Link -->
        <p class="text-center md:text-left text-slate-500 text-xs mt-4 font-bold">
          Don't have an account? 
          <a href="#" class="text-primary font-black hover:underline">Register Now</a>
        </p>

        <!-- Divider -->
        <div class="flex items-center my-4">
          <div class="flex-grow border-t border-slate-150"></div>
          <span class="px-3 text-[9px] font-bold text-slate-400 uppercase tracking-widest">Or login with</span>
          <div class="flex-grow border-t border-slate-150"></div>
        </div>

        <!-- Social Logins -->
        <div class="grid grid-cols-2 gap-3.5">
          <!-- Google -->
          <button class="flex items-center justify-center gap-2 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors active:scale-[0.98]">
            <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
              <path d="M21.35,11.1H12v2.7h5.38c-0.24,1.28 -0.96,2.37 -2.04,3.1v2.6h3.28c1.92,-1.78 3.02,-4.4 3.02,-7.4C21.64,11.83 21.54,11.41 21.35,11.1z" fill="#4285F4" />
              <path d="M12,20.64c2.6,0 4.78,-0.86 6.38,-2.3l-3.28,-2.6c-0.91,0.61 -2.08,0.98 -3.1,0.98 -2.39,0 -4.42,-1.61 -5.14,-3.78H3.48v2.6C5.07,18.7 8.35,20.64 12,20.64z" fill="#34A853" />
              <path d="M6.86,12.94c-0.18,-0.55 -0.28,-1.13 -0.28,-1.74s0.1,-1.19 0.28,-1.74V6.86H3.48c-0.62,1.24 -0.98,2.64 -0.98,4.14s0.36,2.9 0.98,4.14L6.86,12.94z" fill="#FBBC05" />
              <path d="M12,6.18c1.41,0 2.69,0.49 3.69,1.44l2.77,-2.77C16.76,3.2 14.58,2.36 12,2.36c-3.65,0 -6.93,1.94 -8.52,5.14l3.38,2.6C7.58,7.79 9.61,6.18 12,6.18z" fill="#EA4335" />
            </svg>
            <span class="text-xs font-extrabold text-slate-700">Google</span>
          </button>
          <!-- Facebook -->
          <button class="flex items-center justify-center gap-2 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors active:scale-[0.98]">
            <svg class="w-4.5 h-4.5 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <span class="text-xs font-extrabold text-slate-700">Facebook</span>
          </button>
        </div>
      </div>

      <!-- Footer (Mobile Only) -->
      <div class="text-center pt-2 pb-2 text-[10px] text-slate-400 font-semibold select-none md:hidden">
        &copy; 2026 3LINK Networks Ltd.
      </div>

    </div>

  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>

  <!-- Demo navigator widget -->
  <script src="demo-nav.js"></script>
</body>
</html>
