<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - 3LINK Networks</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            primary: '#0047BA',
            'primary-dark': '#00358A',
            'brand-blue': '#00D2FF',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- Desktop Top Header Navbar (Visible only on desktop - Employee Portal) -->
  <header class="hidden md:flex bg-primary text-white border-b border-primary-dark px-8 py-4 justify-between items-center shadow-md select-none shrink-0 z-40">
    <div class="flex items-center gap-2">
      <svg class="w-7 h-7 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
      </svg>
      <div class="flex items-baseline gap-0.5">
        <span class="text-xl font-extrabold text-brand-blue tracking-tight">3</span>
        <span class="text-xl font-black text-white tracking-wide">LINK</span>
        <span class="text-[9px] uppercase tracking-wider text-slate-300 font-bold ml-1.5">Tech</span>
      </div>
    </div>
    
    <!-- Center navigation -->
    <nav class="flex items-center gap-6 text-sm font-extrabold text-white/80">
      <a href="employee-attendance.html" class="text-white border-b-2 border-white pb-0.5">Attendance</a>
      <a href="employee-tasks.html" class="hover:text-white transition-colors">Tasks</a>
      <a href="index.html" class="hover:text-white transition-colors">Portal Select</a>
    </nav>
    
    <!-- Right side -->
    <div class="flex items-center gap-6">
      <a href="#" onclick="alert('No tech alerts.')" class="relative text-white/80 hover:text-white p-2">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
      </a>
      <div class="flex items-center gap-2.5 text-white/80">
        <img src="https://images.unsplash.com/photo-1540569014015-19a7be504e3a?auto=format&fit=crop&q=80&w=80&h=80" class="w-8 h-8 rounded-full border border-white/20 object-cover">
        <span class="text-xs font-bold">Jahid Hasan</span>
      </div>
    </div>
  </header>

  <!-- Responsive Screen Container -->
  <div class="w-full flex-grow flex flex-col bg-slate-50 min-h-screen pb-20 md:pb-6 relative">
    
    <!-- Top Blue Header Section (Mobile only) -->
    <div class="bg-primary pt-4 pb-14 px-6 relative rounded-b-[32px] shadow-lg shadow-primary/10 md:hidden">
      <!-- Status Bar -->
      <div class="w-full flex justify-between items-center text-xs text-white/80 font-semibold mb-6">
        <div>9:41</div>
        <div class="flex items-center gap-1.5">
          <i data-lucide="signal" class="w-3.5 h-3.5"></i>
          <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
          <i data-lucide="battery" class="w-4 h-4"></i>
        </div>
      </div>

      <!-- Navigation & Title Row -->
      <div class="flex justify-between items-center text-white">
        <div class="flex items-center gap-4">
          <button onclick="window.location.href='index.html'" class="p-1 hover:bg-white/10 rounded-lg transition-colors focus:outline-none">
            <i data-lucide="menu" class="w-6 h-6"></i>
          </button>
          <h2 class="text-xl font-extrabold tracking-tight">Attendance</h2>
        </div>
        <!-- Bell icon -->
        <a href="#" onclick="alert('No tech alerts.')" class="p-2 bg-white/10 hover:bg-white/20 text-white rounded-full transition-colors relative">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
        </a>
      </div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="max-w-6xl mx-auto w-full px-6 -mt-8 md:mt-8 z-10 flex-grow flex flex-col gap-6 justify-center">
      
      <!-- Desktop Header (Visible only on desktop) -->
      <div class="hidden md:flex justify-between items-center mb-2">
        <div>
          <h2 class="text-2xl font-black text-slate-900 tracking-tight">Duty Attendance</h2>
          <p class="text-sm text-slate-500 font-semibold mt-1">Log check-in/check-out and track daily field service assignments</p>
        </div>
      </div>

      <!-- Grid layout for desktop splitting -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center md:items-start">
        
        <!-- Left Column: Profile Card -->
        <div class="space-y-6 md:col-span-1">
          <!-- Profile Card -->
          <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100 flex flex-col items-center text-center gap-4">
            <!-- Profile Picture in Double circular border -->
            <div class="relative w-28 h-28 rounded-full border-4 border-slate-50 flex items-center justify-center shadow-inner">
              <img 
                src="https://images.unsplash.com/photo-1540569014015-19a7be504e3a?auto=format&fit=crop&q=80&w=150&h=150" 
                alt="Jahid Hasan" 
                class="w-24 h-24 rounded-full object-cover border-2 border-white"
              >
              <span class="absolute bottom-1 right-2 w-5 h-5 bg-green-500 border-4 border-white rounded-full"></span>
            </div>

            <div>
              <h3 class="text-lg font-black text-slate-800">Jahid Hasan</h3>
              <p class="text-xs text-primary font-bold mt-1 tracking-wide">Field Technician</p>
              <div class="flex items-center gap-1.5 justify-center mt-2.5 text-slate-400 text-xs font-semibold">
                <i data-lucide="map-pin" class="w-4 h-4 text-primary"></i>
                <span>Jessore Office</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column: Action & Stats -->
        <div class="md:col-span-2 space-y-6">
          
          <!-- Action Button Check-In Card -->
          <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col items-center gap-4">
            <button id="attendance-btn" onclick="toggleAttendance()" class="w-full py-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-green-600/20 active:scale-98 transition-all text-sm uppercase tracking-wider focus:outline-none">
              <i data-lucide="check" class="w-5 h-5"></i>
              <span id="btn-text">Check In</span>
            </button>
            <p id="status-label" class="text-xs text-slate-400 font-bold uppercase tracking-wider">Status: Checked Out</p>
          </div>

          <!-- Bottom statistics row card -->
          <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-2xl bg-green-50 text-green-600 flex items-center justify-center shrink-0">
                <i data-lucide="calendar" class="w-6 h-6"></i>
              </div>
              <div>
                <span class="text-[9px] md:text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Today Total Work</span>
                <span class="text-base font-extrabold text-slate-800 mt-0.5 block">6 Tasks</span>
              </div>
            </div>
            <div class="text-green-600 shrink-0">
              <i data-lucide="trending-up" class="w-7 h-7"></i>
            </div>
          </div>

        </div>

      </div>

    </div>

    <!-- Space Filler -->
    <div class="h-6"></div>

    <!-- Employee Navigation Bar (Visible on mobile only) -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 px-6 py-2.5 flex justify-between items-center z-40 md:hidden">
      
      <!-- Attendance / Home (Active) -->
      <a href="employee-attendance.html" class="flex flex-col items-center gap-1 text-primary focus:outline-none">
        <i data-lucide="check-square" class="w-5.5 h-5.5"></i>
        <span class="text-[10px] font-extrabold">Attendance</span>
      </a>

      <!-- Tasks -->
      <a href="employee-tasks.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
        <i data-lucide="clipboard-list" class="w-5.5 h-5.5"></i>
        <span class="text-[10px] font-bold">Tasks</span>
      </a>

      <!-- Profile -->
      <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
        <i data-lucide="settings" class="w-5.5 h-5.5"></i>
        <span class="text-[10px] font-bold">Portal Select</span>
      </a>

    </div>

  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Check attendance state
    let isCheckedIn = localStorage.getItem('tech_checked_in') === 'true';
    updateBtnStyle();

    function updateBtnStyle() {
      const btn = document.getElementById('attendance-btn');
      const text = document.getElementById('btn-text');
      const label = document.getElementById('status-label');

      if (isCheckedIn) {
        btn.className = 'w-full py-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-red-600/20 active:scale-98 transition-all text-sm uppercase tracking-wider focus:outline-none';
        text.innerText = "Check Out";
        label.innerText = "Status: Checked In (08:30 AM)";
        btn.innerHTML = `<i data-lucide="log-out" class="w-5 h-5"></i><span>Check Out</span>`;
      } else {
        btn.className = 'w-full py-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-green-600/20 active:scale-98 transition-all text-sm uppercase tracking-wider focus:outline-none';
        text.innerText = "Check In";
        label.innerText = "Status: Checked Out";
        btn.innerHTML = `<i data-lucide="check" class="w-5 h-5"></i><span>Check In</span>`;
      }
      lucide.createIcons();
    }

    function toggleAttendance() {
      isCheckedIn = !isCheckedIn;
      localStorage.setItem('tech_checked_in', isCheckedIn);
      updateBtnStyle();

      if (isCheckedIn) {
        alert("Check-in successful! Redirecting to task queue.");
        setTimeout(() => {
          window.location.href = 'employee-tasks.html';
        }, 800);
      } else {
        alert("Check-out successful! Attendance logged for today.");
      }
    }
  </script>

  <!-- Demo navigator widget -->
  <script src="demo-nav.js"></script>
</body>
</html>
